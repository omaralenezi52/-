<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سالميات - مشغل الموسيقى العصري</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css"> <style>
    /* ... (CSS الخاص بك كما هو) ... */
    a{ 
      color: #fdfcfb;
    }
    a:hover{ 
      color: #8e3b46;
    }
    footer {
      background: color pink ; /* ملاحظة: يجب تعديل هذا ليصبح 'background-color: pink;' */
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom, #fdfcfb, #e2d1c3);
      color: #2d1b0e;
      overflow-x: hidden;
    }
    header {
      background: linear-gradient(to right, #8e3b46, #c94b62);
      color: white;
      text-align: center;
      padding: 50px 20px 20px;
      font-size: 42px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      letter-spacing: 3px;
      position: relative;
    }
    .hero {
      position: relative;
      width: 100%;
      height: 400px;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }
    .hero img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: grayscale(20%) brightness(80%);
      z-index: 0;
    }
    nav {
      background: #4e4b49;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #4b1d1d;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 40px;
      animation: fadeIn 2s ease;
    }
    .gallery img {
      width: 300px;
      height: 400px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: all 0.4s ease-in-out;
    }
    .gallery img:hover {
      transform: scale(1.05) rotate(0.5deg);
    }
    .music-section {
      text-align: center;
      padding: 60px 20px 30px;
      background-color: #5e5e5e;
    }
    .music-section h2 {
      font-size: 28px;
      color: #241114;
      margin-bottom: 20px;
    }
    /* تم إزالة هذا النمط لأنه لم يعد مطلوباً لـ <audio> الأساسي */
    /* audio {
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
      position: relative;
      right: 400px;
    } */
    .poem {
      background: #fff2e6;
      margin: 50px auto;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      border-radius: 18px;
      font-size: 22px;
      box-shadow: 0 6px 20px rgb(248, 247, 247);
      line-height: 2;
      border: 1px solid #f0c6b0;
    }
    footer {
      background-color: #471414;
      color: white;
      padding: 30px;
      text-align: center;
      margin-top: 60px;
      font-size: 16px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
     a {
      position: relative;
      right:10px;
    }
    /* تم إزالة هذا النمط لأنه لم يعد مطلوباً لـ <h3> */
    /* h3 {
      position: relative;
      right: 400px;
    } */
    /* أنماط المشغل العصري (سيتم تحديثها في ملف style.css) */
    .player-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 30px 20px;
        max-width: 450px;
        width: 90%;
        margin: 40px auto;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

 <header> سالميات </header>

  <div class="hero">
    <img src="images/hero-image.jpg" alt="صورة رئيسية للفنان عبدالله السالم" onerror="this.style.display='none'">
  </div>

  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="nawader.html">نوادر الفنان</a>
    <a href="login.html"> صفحة تسجيل الدخول</a> 
  </nav>

  <div class="gallery">
    <img src="images/photo_1.jpg" alt="عبدالله السالم" onerror="this.style.display='none'" />
    <img src="images/photo_2.jpg" alt="عبدالله السالم" onerror="this.style.display='none'" />
    <img src="images/photo_3.jpg" alt="عبدالله السالم" onerror="this.style.display='none'" />
  </div>

  <div class="music-section">
    <h2>اعجاز انامل السالم</h2>
    
    </video>

    <div class="player-container">
        <div class="track-info">
            <div class="track-art"></div>
            <div class="track-details">
                <div class="track-name">اسم الأغنية الحالية</div>
                <div class="artist-name">اسم الفنان</div>
            </div>
        </div>

        <div class="progress-area">
            <input type="range" value="0" id="seek-slider" class="seek-slider">
            <div class="time-display">
                <div class="current-time">0:00</div>
                <div class="total-duration">0:00</div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="control-btn"><i class="fa fa-backward-step"></i></button>
            <button id="play-pause-btn" class="control-btn large-btn"><i class="fa fa-play"></i></button>
            <button id="next-btn" class="control-btn"><i class="fa fa-forward-step"></i></button>
        </div>

        <div class="volume-container">
            <i class="fa fa-volume-low"></i>
            <input type="range" min="0" max="1" step="0.01" value="1" id="volume-slider" class="volume-slider">
            <i class="fa fa-volume-high"></i>
        </div>

         <div class="playlist-container">
            <h3>قائمة الأغاني</h3>
            <ul id="playlist">
                </ul>
        </div>

        <audio id="audio-player" preload="metadata"></audio>
    </div>

  </div> <div class="poem">
    عن عيوني ياحياتي لا تغيب <br />
    غيبتك عن ناظري سبة بلاي
  </div>
